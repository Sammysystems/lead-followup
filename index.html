<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LandsandHousing — Lead Follow-Up System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F7F4EE; color: #171716; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; max-width: 480px; padding: 2rem; }
    h1 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 600; margin-bottom: 1rem; }
    p { color: #625F58; font-size: 0.875rem; line-height: 1.6; margin-bottom: 2rem; }
    .links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a { display: inline-block; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-decoration: none; text-transform: uppercase; letter-spacing: 0.1em; transition: all 0.3s; }
    .primary { background: linear-gradient(135deg, #B18A4A, #9A7539); color: #fff; }
    .primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(177,138,74,0.3); }
    .secondary { background: #fff; color: #171716; border: 1px solid #DED7CA; }
    .secondary:hover { background: #EEE8DD; }
  </style>
</head>
<body>
  <div class="container">
    <h1>LandsandHousing</h1>
    <p>Lead Follow-Up &amp; Appointment Recovery System</p>
    <div class="links">
      <a href="/admin" class="primary">Admin Dashboard</a>
      <a href="/book" class="secondary">Book Appointment</a>
    </div>
  </div>
</body>
</html>
